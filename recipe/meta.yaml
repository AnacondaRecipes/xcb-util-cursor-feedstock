{% set name = "xcb-util-cursor" %}
{% set version = "0.1.6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://xcb.freedesktop.org/dist/{{ name }}-{{ version }}.tar.xz
  sha256: fdeb8bd127873519be5cc70dcd0d3b5d33b667877200f9925a59fdcad8f7a933

build:
  number: 0
  skip: true  # [not linux]
  run_exports:
    - {{ pin_subpackage('xcb-util-cursor', max_pin='x.x') }}

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler('c') }}
    - make
    - m4
    - pkg-config
  host:
    - libxcb {{ libxcb }}
    - xorg-xorgproto
    - xcb-util-renderutil
    - xcb-util-image
  run:
    - libxcb {{ libxcb }}

test:
  commands:
    - test -f ${PREFIX}/lib/libxcb-cursor.so
  # Check downstream packages if needed.
  # downstreams:
  #   - qtbase

about:
  home: https://xcb.freedesktop.org/
  dev_url: https://gitlab.freedesktop.org/xorg/lib/libxcb-cursor
  doc_url: https://gitlab.freedesktop.org/xorg/lib/libxcb-cursor
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: port of Xlib libXcursor functions
  description: xcb-util port of libxcursor.

extra:
  recipe-maintainers:
    - n-elie
